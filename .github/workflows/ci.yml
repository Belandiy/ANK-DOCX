name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet-tests:
    name: C# Tests and Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET Tests
        run: dotnet test tools/AcademicDocx.Tests/AcademicDocx.Tests.csproj --configuration Release --verbosity normal

  quarto-check:
    name: Quarto Extension and Filters Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libjpeg-dev libtiff-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("xml2", "jsonlite", "digest", "zip", "yaml", "officer", "flextable", "equatags", "ggplot2", "ggpattern", "ragg", "svglite", "knitr", "rmarkdown"))'

      - name: Trial Render (Diagnostic Mode)
        env:
          ACADEMIC_SKIP_WORD: "1"
        run: |
          cd academic
          quarto render --to academic-docx --no-clean
