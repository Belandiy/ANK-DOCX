title: Academic DOCX
author: AutoNormoKontrol contributors
version: 0.1.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    docx:
      csl: gost-r-7-0-5-2008-numeric.csl
      reference-doc: academic.docx
      template: document.openxml
      toc: true
      toc-depth: 3
      toc-title: "Оглавление"
      number-sections: false
      fig-format: svg
      fig-dpi: 600
      # Knitr-specific options belong here, not under execute.
      # The device background is independent of the ggplot2 theme.
      knitr:
        opts_chunk:
          dev: svglite
          dev.args:
            bg: transparent
      filters:
        - academic.lua
      crossref:
        fig-title: "Рисунок"
        tbl-title: "Таблица"
        lst-title: "Листинг"
        title-delim: " — "
        lst-prefix: "листинге"
