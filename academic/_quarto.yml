project:
  type: book
  output-dir: _book
  post-render:
    - _extensions/academic/finalize.R
book:
  title: "Исследование суммы математических функций"
  author: "Иванов Иван Иванович"
  output-file: coursework
  chapters:
    - index.qmd
    - introduction.qmd
    - model.qmd
    - tables.qmd
    - references.qmd
format:
  academic-docx: default
engine: knitr
lang: ru
bibliography: references.bib
link-citations: true
metadata-files: [metadata.yml]
execute:
  # Common figure output settings; individual chunks choose their own height.
  fig-width: 6.2
  out-width: "95%"
  echo: false
  cache: false
  freeze: false
  error: false
  warning: true
